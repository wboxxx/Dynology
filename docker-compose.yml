version: '3.8'

services:
  dynogy-agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: dynogy-agent
    restart: unless-stopped
    ports:
      - "${DYNOGY_PORT:-4000}:4000"  # Port mapping
    volumes:
      # Mount services directory (where service repositories will be stored)
      - ${SERVICES_DIR:-./services}:/volume1/docker/dynogy/services
      # Mount logs directory
      - ${DEPLOY_LOG_DIR:-./logs}:/volume1/docker/dynogy/logs
      # Mount Docker socket to allow agent to run docker commands
      - "/var/run/docker.sock:/var/run/docker.sock"
    environment:
      - DYNOGY_PORT=${DYNOGY_PORT:-4000}
      - SERVICES_DIR=${SERVICES_DIR:-/volume1/docker/dynogy/services}
      - DEPLOY_LOG_DIR=${DEPLOY_LOG_DIR:-/volume1/docker/dynogy/logs}
      # Optional: webhook secret for V2
      # - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
    networks:
      - dynogy-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  dynogy-network:
    driver: bridge

